name: 功能需求
description: 提议新增能力或改进现有体验
title: "[Feature]: "
labels: ["type: feature", "status: triage"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue 和 Discussion，未发现相同需求。
          required: true
        - label: 我描述的是业务问题和期望结果，而不只是指定实现方式。
          required: true
  - type: dropdown
    id: area
    attributes:
      label: 能力领域
      options:
        - 模型 API / SDK 接入
        - 模型与渠道路由
        - API Key / 权限
        - 用量 / 计费 / 预算
        - 服务质量 / 日志
        - 控制台 / 门户
        - 文档 / 社区协作
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 业务场景与问题
      description: 谁在什么场景遇到什么问题？频率和影响如何？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述成功时用户能完成什么，不必限定内部实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
      description: 目前如何处理？为什么不够？
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 用户与规模
      description: 可填写受影响的角色、团队数量、请求规模或合规约束；不要包含客户机密。
  - type: textarea
    id: additional
    attributes:
      label: 补充材料
      description: 可提供已脱敏的流程、界面或接口示例。
